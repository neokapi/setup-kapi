name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily canary: the action installs from neokapi/neokapi releases, so it can
  # break without a commit here (a renamed release asset did exactly that for
  # 1.2.0). The schedule catches that class of breakage; the prerelease job
  # below catches it while it is still an RC.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

env:
  # The state cache jobs need kapi 1.2, the first release that keeps its state
  # under .kapi/work/.
  STATE_CACHE_KAPI_VERSION: 1.2.0-rc32
  # The plugin cache jobs seed a cache with this kapi and a bowrain the newest
  # stable kapi does not pick on a fresh install, then set up the newest kapi
  # over it. The registry lists bowrain 1.3.0 (stable) and 1.4.0-rc5 (beta)
  # only (registry#6), so the seed is the beta.
  PLUGIN_SEED_KAPI_VERSION: 1.2.0
  PLUGIN_SEED_BOWRAIN_VERSION: 1.4.0-rc5

jobs:
  test-latest:
    name: "Latest (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup kapi (latest)
        id: setup
        uses: ./
        # No bowrain build is listed for Windows until the next kapi release
        # (registry#6, a founder decision), so the Windows run installs no
        # plugin and the step below asserts the install still fails there.
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          plugins: ${{ matrix.os != 'windows-latest' && 'bowrain' || '' }}

      - name: Assert no bowrain build is listed for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: test/plugins/windows-unlisted.sh

      - name: Verify version output
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "Installed version: ${INSTALLED_VERSION}"
          test -n "${INSTALLED_VERSION}"

      - name: Verify kapi is on PATH
        shell: bash
        run: kapi version

  test-pinned:
    name: "Pinned version (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Get latest version for pinned test
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
        # Use the action's own resolver rather than a second copy of the logic.
        # This step used to call `releases/latest` directly and hit exactly the
        # bug the action had: neokapi/neokapi publishes plugin and app releases
        # alongside CLI ones, so that flag lands on whichever was published last
        # (a plugin, today), and the pinned test then asked for version
        # "check-v0.1.0".
        run: |
          VERSION=$(./scripts/resolve-version.sh latest)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Pinning to CLI version ${VERSION}"

      - name: Setup kapi (pinned)
        id: setup
        uses: ./
        # No bowrain build is listed for Windows until the next kapi release
        # (registry#6, a founder decision), so the Windows run installs no
        # plugin and the step below asserts the install still fails there.
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          version: ${{ steps.version.outputs.version }}
          plugins: ${{ matrix.os != 'windows-latest' && 'bowrain' || '' }}

      - name: Assert no bowrain build is listed for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: test/plugins/windows-unlisted.sh

      - name: Verify correct version
        shell: bash
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
          ACTUAL: ${{ steps.setup.outputs.version }}
        run: |
          echo "Expected: ${EXPECTED}, Actual: ${ACTUAL}"
          test "${EXPECTED}" = "${ACTUAL}"

  # Canary against the newest CLI prerelease. Release packaging changes land
  # on RCs first (the kapi_ → kapi-cli_ archive rename shipped on 1.2.0-rc1),
  # so installing the newest prerelease here fails weeks before the same
  # breakage would reach a stable release and every consumer workflow.
  test-prerelease:
    name: "Prerelease canary"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve newest CLI prerelease
        id: prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
        # Same tag discipline as resolve-version.sh: only vX.Y.Z-… CLI tags,
        # never plugin/app tags (check-v…, asr-v…, bowrain-v…).
        run: |
          VERSION=$(
            gh api "repos/neokapi/neokapi/releases?per_page=100" --paginate \
              --jq '.[] | select(.draft == false and .prerelease == true) | .tag_name' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-' |
              sed 's/^v//' |
              sort -V |
              tail -n 1
          ) || true
          if [ -z "${VERSION}" ]; then
            echo "No CLI prerelease found — nothing to canary."
          else
            echo "Newest CLI prerelease: ${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup kapi (prerelease)
        if: steps.prerelease.outputs.version != ''
        id: setup
        uses: ./
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          version: ${{ steps.prerelease.outputs.version }}

      - name: Verify kapi is on PATH
        if: steps.prerelease.outputs.version != ''
        shell: bash
        run: kapi version

  # The state cache round trip on a kapi 1.2 project. This job runs the fixture
  # and the action saves the cache at job end; the next job restores it. Each
  # job compares its run in the cached project directory with a cold run of a
  # pristine copy, and the comparison covers every command's exit code and
  # output and every file the project holds afterwards.
  test-state-cache-save:
    name: "State cache save (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # kapi 1.2 prereleases publish no Windows CLI build.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup kapi
        uses: ./
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          version: ${{ env.STATE_CACHE_KAPI_VERSION }}
          plugins: ""
          project-dir: test/fixture

      - name: Run the fixture and a cold copy
        shell: bash
        run: |
          test/state-cache/cold-copy.sh "${RUNNER_TEMP}/cold"
          test/state-cache/run.sh test/fixture "${RUNNER_TEMP}/results/cached"
          test/state-cache/run.sh "${RUNNER_TEMP}/cold/test/fixture" "${RUNNER_TEMP}/results/cold"
          test/state-cache/compare.sh "${RUNNER_TEMP}/results/cold" "${RUNNER_TEMP}/results/cached"

      # The restore job needs something to restore; this fails first if kapi
      # stops writing the path the action caches.
      - name: Require the parse cache kapi writes
        shell: bash
        run: |
          test -s test/fixture/.kapi/work/cache/docs/index.db
          cp test/fixture/.kapi/work/store.db "${RUNNER_TEMP}/results/store.db"

      - uses: actions/upload-artifact@v7
        with:
          name: state-cache-save-${{ matrix.os }}
          path: ${{ runner.temp }}/results

  test-state-cache-restore:
    name: "State cache restore (${{ matrix.os }})"
    needs: test-state-cache-save
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup kapi
        uses: ./
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          version: ${{ env.STATE_CACHE_KAPI_VERSION }}
          plugins: ""
          project-dir: test/fixture

      - name: Require the restored parse cache
        shell: bash
        run: |
          docs=test/fixture/.kapi/work/cache/docs
          test -s "${docs}/index.db"
          ls "${docs}"/parts-*.log > /dev/null
          echo "Restored $(find "${docs}" -type f | wc -l | tr -d ' ') files into ${docs}"
          cp -R "${docs}" "${RUNNER_TEMP}/restored-docs"

      - uses: actions/download-artifact@v8
        with:
          name: state-cache-save-${{ matrix.os }}
          path: ${{ runner.temp }}/saved

      - name: A warm run matches a cold run
        shell: bash
        run: |
          test/state-cache/cold-copy.sh "${RUNNER_TEMP}/cold"
          test/state-cache/run.sh test/fixture "${RUNNER_TEMP}/results/warm"
          test/state-cache/run.sh "${RUNNER_TEMP}/cold/test/fixture" "${RUNNER_TEMP}/results/cold"
          test -s "${RUNNER_TEMP}/results/warm/docs-before.txt"
          test/state-cache/compare.sh "${RUNNER_TEMP}/results/cold" "${RUNNER_TEMP}/results/warm"
          test/state-cache/compare.sh "${RUNNER_TEMP}/saved/cold" "${RUNNER_TEMP}/results/warm"

      - name: A cache saved before a source change does not hide it
        shell: bash
        run: |
          git clean -fdxq test/fixture
          git checkout -- test/fixture
          mkdir -p test/fixture/.kapi/work/cache
          cp -R "${RUNNER_TEMP}/restored-docs" test/fixture/.kapi/work/cache/docs
          test/state-cache/change-source.sh test/fixture
          test/state-cache/cold-copy.sh "${RUNNER_TEMP}/cold-changed"
          test/state-cache/change-source.sh "${RUNNER_TEMP}/cold-changed/test/fixture"
          test/state-cache/run.sh test/fixture "${RUNNER_TEMP}/results/warm-changed"
          test/state-cache/run.sh "${RUNNER_TEMP}/cold-changed/test/fixture" "${RUNNER_TEMP}/results/cold-changed"
          test/state-cache/compare.sh "${RUNNER_TEMP}/results/cold-changed" "${RUNNER_TEMP}/results/warm-changed"

      # The negative control: .kapi/work/store.db holds stored targets and the
      # unit working set, so restoring it has to change a result. If the
      # comparison reports no difference here, it cannot be trusted above.
      - name: The comparison catches a restored store
        shell: bash
        run: |
          git clean -fdxq test/fixture
          git checkout -- test/fixture
          mkdir -p test/fixture/.kapi/work/cache
          cp -R "${RUNNER_TEMP}/restored-docs" test/fixture/.kapi/work/cache/docs
          cp "${RUNNER_TEMP}/saved/store.db" test/fixture/.kapi/work/store.db
          test/state-cache/run.sh test/fixture "${RUNNER_TEMP}/results/warm-store"
          if test/state-cache/compare.sh "${RUNNER_TEMP}/results/cold" "${RUNNER_TEMP}/results/warm-store"; then
            echo "::error::Restoring .kapi/work/store.db changed no result, so the comparison cannot detect restored state."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: state-cache-restore-${{ matrix.os }}
          path: ${{ runner.temp }}/results

  # parse-cache and its deprecated name cache-tm. The save job left a parse
  # cache to restore, and no kapi command runs here, so whether the cache
  # directory exists after setup shows which value the action acted on. When
  # cache-tm is set, it decides.
  test-parse-cache-input:
    name: "Parse cache input (${{ matrix.case }})"
    needs: test-state-cache-save
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: "parse-cache: false"
            parse_cache: "false"
            cache_tm: ""
            restored: "false"
          - case: "cache-tm: false"
            parse_cache: "true"
            cache_tm: "false"
            restored: "false"
          - case: "cache-tm: true over parse-cache: false"
            parse_cache: "false"
            cache_tm: "true"
            restored: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Setup kapi
        uses: ./
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          version: ${{ env.STATE_CACHE_KAPI_VERSION }}
          plugins: ""
          project-dir: test/fixture
          parse-cache: ${{ matrix.parse_cache }}
          cache-tm: ${{ matrix.cache_tm }}

      - name: Check whether the parse cache was restored
        shell: bash
        env:
          WANT_RESTORED: ${{ matrix.restored }}
        run: |
          docs=test/fixture/.kapi/work/cache/docs
          if [ "${WANT_RESTORED}" = "true" ]; then
            test -s "${docs}/index.db"
          else
            test ! -e "${docs}"
          fi

  # The step that names the parse cache directory, run out of action.yml for
  # each value KAPI_PARSE_CACHE_DIR can have, and the two paths both parse
  # cache steps carry.
  test-parse-cache-dir:
    name: "Parse cache directory (KAPI_PARSE_CACHE_DIR)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run the parse cache directory harness
        shell: bash
        run: |
          yq --version
          test/parse-cache/env.sh

  # Released kapi versions ignore KAPI_PARSE_CACHE_DIR and keep the parse
  # cache in the checkout, which the action also carries.
  test-parse-cache-in-tree:
    name: "Parse cache in the checkout (kapi ${{ matrix.version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.3.0", "1.4.0-rc5"]
    steps:
      - uses: actions/checkout@v6

      - name: Setup kapi
        uses: ./
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          version: ${{ matrix.version }}
          plugins: ""
          project-dir: test/fixture

      - name: Check the exported directory and the in-tree cache
        shell: bash
        run: |
          test "${KAPI_PARSE_CACHE_DIR}" = "${RUNNER_TEMP}/kapi-parse-cache"
          kapi status -p test/fixture/kapi.yaml > /dev/null
          test -s test/fixture/.kapi/work/cache/docs/index.db
          test ! -e "${KAPI_PARSE_CACHE_DIR}"

  test-cache:
    name: "Cache hit (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      # First install: populates the cache.
      - name: Setup kapi (first)
        uses: ./
        # No bowrain build is listed for Windows until the next kapi release
        # (registry#6, a founder decision), so the Windows run installs no
        # plugin and the step below asserts the install still fails there.
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          plugins: ${{ matrix.os != 'windows-latest' && 'bowrain' || '' }}

      # Second install: should hit the cache.
      - name: Setup kapi (cached)
        uses: ./
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          plugins: ${{ matrix.os != 'windows-latest' && 'bowrain' || '' }}

      - name: Assert no bowrain build is listed for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: test/plugins/windows-unlisted.sh

      - name: Verify kapi works from cache
        shell: bash
        run: kapi version

      # A cache hit installs no plugin, so check the cached one is current.
      - name: Verify the cached plugin is current
        if: runner.os != 'Windows'
        shell: bash
        run: test/plugins/matches-fresh.sh bowrain

  # The plugin cache across a kapi upgrade. The seed job sets up an older kapi
  # and leaves a bowrain in the plugin root that a fresh install by the newest
  # kapi would not pick, as a cache saved for another kapi or registry entry
  # would hold; the action saves that at job end.
  # The upgrade job then sets up the newest kapi with the same plugins input,
  # and the bowrain it is left with must be the one this kapi installs fresh.
  # Windows is absent because the registry lists no Windows bowrain build.
  test-plugin-seed:
    name: "Plugin cache seed (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup an older kapi
        uses: ./
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          version: ${{ env.PLUGIN_SEED_KAPI_VERSION }}
          plugins: bowrain
          parse-cache: "false"

      - name: Leave a bowrain a fresh install would not pick
        shell: bash
        run: |
          kapi plugin install --channel beta "bowrain@${PLUGIN_SEED_BOWRAIN_VERSION}"
          grep -q "\"${PLUGIN_SEED_BOWRAIN_VERSION}\"" ~/.local/share/kapi/plugins/bowrain/installed.json

  test-plugin-upgrade:
    name: "Plugin cache after a kapi upgrade (${{ matrix.os }})"
    needs: test-plugin-seed
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup the newest kapi
        id: setup
        uses: ./
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          plugins: bowrain
          parse-cache: "false"

      - name: Require a newer kapi than the seed
        shell: bash
        env:
          INSTALLED: ${{ steps.setup.outputs.version }}
        run: test "${INSTALLED}" != "${PLUGIN_SEED_KAPI_VERSION}"

      - name: Verify bowrain matches a fresh install
        shell: bash
        run: test/plugins/matches-fresh.sh bowrain

  # The plugin set the upgrade job saved is restored for the same kapi.
  test-plugin-cache-hit:
    name: "Plugin cache hit (${{ matrix.os }})"
    needs: test-plugin-upgrade
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup the newest kapi
        id: setup
        uses: ./
        with:
          token: ${{ secrets.NEOKAPI_GITHUB_TOKEN }}
          plugins: bowrain
          parse-cache: "false"

      - name: Require a plugin cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: test "${CACHE_HIT}" = "true"

      - name: Verify bowrain matches a fresh install
        shell: bash
        run: test/plugins/matches-fresh.sh bowrain

  # TEMPORARY: measures the owner and mode of a parse cache directory after an
  # actions/cache round trip, on each hosted runner. Remove before merging.
  probe-cache-mode-save:
    name: "Probe cache mode: save (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Make a 0700 directory with files
        shell: bash
        run: |
          d="${RUNNER_TEMP}/kapi-parse-cache"
          # Git Bash on Windows cannot set a mode with mkdir -m.
          if [ "$RUNNER_OS" = Windows ]; then mkdir "$d"; else mkdir -m 700 "$d"; fi
          echo entry > "$d/index.db"
          (umask 077; echo part > "$d/parts-a.log")
          if [ "$RUNNER_OS" = Windows ]; then mkdir "$d/sub"; else mkdir -m 700 "$d/sub"; fi
          echo x > "$d/sub/blob"
          echo "umask: $(umask)"
          if stat -c '%A %U:%G %a %n' "$d" > /dev/null 2>&1; then
            stat -c '%A %U:%G %a %n' "$d" "$d"/* "$d/sub/blob"
          else
            stat -f '%Sp %Su:%Sg %Lp %N' "$d" "$d"/* "$d/sub/blob"
          fi
          if [ "$RUNNER_OS" = Windows ]; then icacls "$(cygpath -w "$d")"; fi

      - uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/kapi-parse-cache
            test/fixture/.kapi/work/cache/docs
          key: probe-mode-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  probe-cache-mode-restore:
    name: "Probe cache mode: restore (${{ matrix.os }})"
    needs: probe-cache-mode-save
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/kapi-parse-cache
            test/fixture/.kapi/work/cache/docs
          key: probe-mode-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Print owner and mode of what was restored
        shell: bash
        run: |
          d="${RUNNER_TEMP}/kapi-parse-cache"
          echo "user: $(id -un 2>/dev/null || whoami) umask: $(umask)"
          ls -ld "$d"
          if stat -c '%A %U:%G %a %n' "$d" > /dev/null 2>&1; then
            stat -c '%A %U:%G %a %n' "$d" "$d"/* "$d/sub/blob"
          else
            stat -f '%Sp %Su:%Sg %Lp %N' "$d" "$d"/* "$d/sub/blob"
          fi
          if [ "$RUNNER_OS" = Windows ]; then icacls "$(cygpath -w "$d")"; icacls "$(cygpath -w "$d/index.db")"; fi
