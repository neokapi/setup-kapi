name: "Setup Kapi CLI"
description: "Install the kapi CLI for CI workflows — downloads, verifies, caches, and configures the binary"
branding:
  icon: "globe"
  color: "blue"

inputs:
  version:
    description: "Kapi CLI version (e.g. '1.1.0' or 'latest' for the newest stable CLI release)"
    required: false
    default: "latest"
  token:
    description: "GitHub token used for release downloads and API rate limits. The built-in GITHUB_TOKEN is sufficient now that neokapi/neokapi is public."
    required: false
    default: ${{ github.token }}
  plugins:
    description: >-
      Newline- or comma-separated plugin refs to install, as the registry
      names them (e.g. 'bowrain', 'okapi-bridge'). The 'kapi-' binary prefix
      is accepted and stripped ('kapi-bowrain' → 'bowrain'). Defaults to
      'bowrain' so server-connected projects work out of the box; pass '' to
      install nothing.
    required: false
    default: "bowrain"
  auth-token:
    description: "Bowrain server JWT auth token (exported as BOWRAIN_AUTH_TOKEN)"
    required: false
    default: ""
  server:
    description: "Bowrain server URL (exported as BOWRAIN_SERVER_URL)"
    required: false
    default: ""
  parse-cache:
    description: >-
      Keep kapi's parse cache between CI runs, so a later run replays the files
      it already parsed instead of parsing them again. A restored entry never
      changes a result: kapi parses a file again when its content, the parse
      configuration, the recipe or the kapi build differs. Only the parse cache
      is carried, never the project store or the project's context; a job that
      needs the context runs `kapi context pull`. Runs only when a kapi.yaml
      recipe (or legacy *.kapi) is present in project-dir. Set 'false' to turn
      it off.
    required: false
    default: "true"
  cache-tm:
    description: >-
      Deprecated: use parse-cache. When set, it decides in place of
      parse-cache, and the action prints a warning.
    required: false
    default: ""
  project-dir:
    description: "Directory holding the kapi.yaml project whose parse cache is kept between runs. Default: repository root."
    required: false
    default: "."

outputs:
  version:
    description: "Installed kapi CLI version (e.g. '0.5.0')"
    value: ${{ steps.resolve.outputs.version }}
  cache-hit:
    description: "Whether the plugin cache was hit"
    value: ${{ steps.plugin-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    # 1. Resolve version
    - name: Resolve version
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        VERSION=$("${ACTION_PATH}/scripts/resolve-version.sh" "${INPUT_VERSION}")
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "Resolved version: ${VERSION}"

    # 2. Detect platform
    - name: Detect platform
      id: platform
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        source "${ACTION_PATH}/scripts/platform.sh"
        echo "os=${GOOS}" >> "$GITHUB_OUTPUT"
        echo "arch=${GOARCH}" >> "$GITHUB_OUTPUT"
        echo "ext=${ARCHIVE_EXT}" >> "$GITHUB_OUTPUT"
        echo "Platform: ${GOOS}/${GOARCH} (archive: .${ARCHIVE_EXT})"

    # 3. Restore binary cache
    - name: Restore binary cache
      id: binary-cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/setup-kapi
        key: kapi-${{ steps.resolve.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    # 4. Download + verify (on cache miss)
    - name: Download and verify
      if: steps.binary-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
        VERSION: ${{ steps.resolve.outputs.version }}
        PLATFORM_OS: ${{ steps.platform.outputs.os }}
        PLATFORM_ARCH: ${{ steps.platform.outputs.arch }}
        PLATFORM_EXT: ${{ steps.platform.outputs.ext }}
        INSTALL_DIR: ${{ runner.temp }}/setup-kapi
      run: |
        "${ACTION_PATH}/scripts/download-verify.sh" \
          "${VERSION}" \
          "${PLATFORM_OS}" \
          "${PLATFORM_ARCH}" \
          "${PLATFORM_EXT}" \
          "${INSTALL_DIR}"

    # 5. Add to PATH
    - name: Add to PATH
      shell: bash
      env:
        INSTALL_DIR: ${{ runner.temp }}/setup-kapi
      run: echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

    # 6. Verify installation
    - name: Verify installation
      shell: bash
      run: kapi version

    # 7. Configure bowrain server auth (optional)
    - name: Configure auth
      if: inputs.auth-token != ''
      shell: bash
      env:
        INPUT_AUTH_TOKEN: ${{ inputs.auth-token }}
        INPUT_SERVER: ${{ inputs.server }}
      run: |
        echo "BOWRAIN_AUTH_TOKEN=${INPUT_AUTH_TOKEN}" >> "$GITHUB_ENV"
        if [ -n "${INPUT_SERVER}" ]; then
          echo "BOWRAIN_SERVER_URL=${INPUT_SERVER}" >> "$GITHUB_ENV"
        fi
        echo "Auth configured for kapi"

    # 8. Compute the plugin cache key. kapi picks each plugin's version from
    #    the requested ref, its own version (a registry entry can require a
    #    newer kapi) and the plugin's registry entry. The key covers all
    #    three, so a cache restores only the plugins a fresh install by this
    #    kapi would choose; a new kapi or a new plugin release misses it.
    - name: Compute plugin cache key
      if: inputs.plugins != ''
      id: plugin-hash
      shell: bash
      env:
        INPUT_PLUGINS: ${{ inputs.plugins }}
        KAPI_VERSION: ${{ steps.resolve.outputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        HASH=$("${ACTION_PATH}/scripts/plugin-cache-key.sh" "${KAPI_VERSION}" "${INPUT_PLUGINS}")
        echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

    # 9. Restore plugin cache
    - name: Restore plugin cache
      if: inputs.plugins != ''
      id: plugin-cache
      uses: actions/cache@v5
      with:
        # kapi installs plugins under $XDG_DATA_HOME/kapi/plugins — i.e.
        # ~/.local/share/kapi/plugins when XDG_DATA_HOME is unset, as it is on a
        # runner. The old ~/.config/kapi/plugins is the CONFIG dir: nothing was
        # ever written there, so the cache saved an empty path and every run
        # re-downloaded every plugin.
        path: ~/.local/share/kapi/plugins
        #
        # No restore-keys: a partial match would restore plugins chosen for
        # another kapi or an older registry entry.
        key: kapi-plugins-v2-${{ steps.plugin-hash.outputs.hash }}-${{ runner.os }}-${{ runner.arch }}

    # 10. Install plugins (on cache miss)
    - name: Install plugins
      if: inputs.plugins != '' && steps.plugin-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        INPUT_PLUGINS: ${{ inputs.plugins }}
      run: |
        # Normalize: replace commas with newlines, trim whitespace, skip empty
        # lines, and strip the 'kapi-' binary prefix — the registry names the
        # plugin 'bowrain' while its binary and archives are 'kapi-bowrain',
        # so both spellings should install.
        PLUGINS=$(echo "${INPUT_PLUGINS}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^kapi-//' | grep -v '^$')
        while IFS= read -r plugin; do
          # A prerelease constraint (name@X.Y.Z-rcN) lives on the beta
          # channel; resolving it against stable can only fail.
          args=()
          case "${plugin}" in
            *@*-*) args+=(--channel beta) ;;
          esac
          echo "Installing plugin: ${plugin}${args:+ (${args[*]})}"
          kapi plugins install ${args[@]+"${args[@]}"} "${plugin}"
        done <<< "${PLUGINS}"

    # 11. Resolve whether to carry the parse cache. cache-tm is the deprecated
    #     name of parse-cache; a workflow that still sets it keeps its meaning.
    - name: Resolve parse cache input
      id: parse-cache
      shell: bash
      env:
        INPUT_PARSE_CACHE: ${{ inputs.parse-cache }}
        INPUT_CACHE_TM: ${{ inputs.cache-tm }}
      run: |
        ENABLED="${INPUT_PARSE_CACHE}"
        if [ -n "${INPUT_CACHE_TM}" ]; then
          echo "::warning title=setup-kapi::The cache-tm input is deprecated; use parse-cache instead."
          ENABLED="${INPUT_CACHE_TM}"
        fi
        echo "enabled=${ENABLED}" >> "$GITHUB_OUTPUT"

    # 12. Detect a kapi project: a committed kapi.yaml recipe (or legacy *.kapi).
    #     The parse cache is carried only for a project. The recipe is the
    #     signal because kapi's state is never committed, so a fresh checkout
    #     holds none.
    - name: Detect kapi project
      id: detect-project
      if: steps.parse-cache.outputs.enabled != 'false'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
      run: |
        if ls "${PROJECT_DIR}"/kapi.yaml >/dev/null 2>&1 || ls "${PROJECT_DIR}"/*.kapi >/dev/null 2>&1; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false (no kapi.yaml recipe (or legacy *.kapi) in ${PROJECT_DIR}); skipping the parse cache" >&2
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    # 13. Name the directory kapi keeps its parse cache in. A kapi that reads
    #     KAPI_PARSE_CACHE_DIR keeps the parse cache there; a kapi up to 1.3
    #     ignores the variable and keeps it in the checkout, at
    #     .kapi/work/cache/docs. The cache step carries both paths, and the one
    #     the installed kapi does not use is absent. Both are the same strings
    #     on every run, which keeps the cache version stable.
    #
    #     A KAPI_PARSE_CACHE_DIR the workflow set itself is kept, and cached
    #     when it lies under runner.temp; otherwise the parse cache is not
    #     carried. (kapi refuses a directory inside the checkout.)
    #
    #     The step creates no directory. kapi creates the parse cache
    #     directory with owner-only permissions (0700) and refuses one that is
    #     wider, a link, or owned by someone else; a directory made here with
    #     a plain mkdir would be 0755 and be saved, and restored, that way.
    - name: Set kapi parse cache directory
      id: parse-cache-dir
      if: steps.parse-cache.outputs.enabled != 'false' && steps.detect-project.outputs.found == 'true'
      shell: bash
      env:
        FIXED_DIR: ${{ runner.temp }}/kapi-parse-cache
      run: |
        if [ -z "${KAPI_PARSE_CACHE_DIR:-}" ]; then
          echo "KAPI_PARSE_CACHE_DIR=${FIXED_DIR}" >> "$GITHUB_ENV"
          echo "dir=${FIXED_DIR}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        dir="${KAPI_PARSE_CACHE_DIR}"
        case "/${dir//\\//}/" in
          */../*)
            echo "::warning title=setup-kapi::KAPI_PARSE_CACHE_DIR (${dir}) has a '..' component, so the parse cache is not carried."
            exit 0
            ;;
        esac
        base="${RUNNER_TEMP%[/\\]}"
        if [ -n "${base}" ]; then
          case "${dir}" in
            "${base}"/* | "${base}"\\*)
              echo "dir=${dir}" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
        fi
        echo "::warning title=setup-kapi::KAPI_PARSE_CACHE_DIR (${dir}) is not under runner.temp, so the parse cache is not carried."

    # 14. Restore kapi's parse cache, and save it at job end. The key is unique
    #     to the job and run attempt, so every run saves its own cache through
    #     actions/cache's post step, and the restore takes the newest cache for
    #     the same kapi version, preferring the same ref. The key hashes no
    #     source file: kapi keys each entry by the file's path and content
    #     hash, the parse configuration, the recipe and the kapi build, and
    #     parses again on any mismatch, so an older cache is still useful after
    #     a source edit, and a restored entry is either valid for the checkout
    #     or ignored.
    #
    #     Only the parse cache is carried. The project store, the extraction
    #     batches, the redaction vault and the sync state (with its claim
    #     token) stay out: a restored store changes what kapi status, kapi
    #     check --ship and kapi up report, and the rest belongs to the
    #     checkout that wrote it. The project's context lives in kapi's
    #     workspace; a job fetches it with `kapi context pull`, which this
    #     action leaves to kapi-action's context-sync input or the workflow's
    #     own step.
    #
    #     The kapi version is part of the key because the parse cache keeps the
    #     entries every build wrote; a new version starts from an empty cache.
    #
    #     GitHub scopes caches by ref: a run restores caches its own ref saved
    #     and those of the default branch (and a pull request's base), never
    #     another branch's or a pull request's, so a pull request from a fork
    #     cannot reach the default branch's runs through this cache. A
    #     pull_request_target run executes in the base branch's scope, so there
    #     the cache is restored and never saved.
    - name: Restore kapi parse cache
      if: steps.parse-cache-dir.outputs.dir != '' && github.event_name != 'pull_request_target'
      uses: actions/cache@v5
      with:
        path: |
          ${{ steps.parse-cache-dir.outputs.dir }}
          ${{ inputs.project-dir }}/.kapi/work/cache/docs
        key: kapi-parse-${{ runner.os }}-${{ steps.resolve.outputs.version }}-${{ github.ref_name }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          kapi-parse-${{ runner.os }}-${{ steps.resolve.outputs.version }}-${{ github.ref_name }}-
          kapi-parse-${{ runner.os }}-${{ steps.resolve.outputs.version }}-

    - name: Restore kapi parse cache (no save)
      if: steps.parse-cache-dir.outputs.dir != '' && github.event_name == 'pull_request_target'
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ steps.parse-cache-dir.outputs.dir }}
          ${{ inputs.project-dir }}/.kapi/work/cache/docs
        key: kapi-parse-${{ runner.os }}-${{ steps.resolve.outputs.version }}-${{ github.ref_name }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          kapi-parse-${{ runner.os }}-${{ steps.resolve.outputs.version }}-${{ github.ref_name }}-
          kapi-parse-${{ runner.os }}-${{ steps.resolve.outputs.version }}-
